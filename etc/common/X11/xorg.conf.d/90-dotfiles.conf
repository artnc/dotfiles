# Enable tap-to-click on touchpads
Section "InputClass"
  Identifier "touchpad"
  Driver "libinput"
  MatchIsTouchpad "on"
  Option "Tapping" "on"
EndSection

# Remap Caps Lock to Super. Unlike xmodmap, X reapplies this whenever it re-adds
# a keyboard, e.g. after systemd's pacman hook runs `udevadm trigger -c change`.
# This replaces the XkbOptions from localectl's 00-keyboard.conf, so keep its
# terminate option too
Section "InputClass"
  Identifier "keyboard"
  MatchIsKeyboard "on"
  Option "XkbOptions" "caps:super,terminate:ctrl_alt_bksp"
EndSection
