<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Render text like macOS does: grayscale antialiasing with slight hinting -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
    <edit mode="assign" name="rgba"><const>none</const></edit>
  </match>

  <!-- Use color emoji instead of DejaVu Sans, which fontconfig picks otherwise -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Use the same monospace and sans serif fonts as Ghostty, Sway, Waybar,
       dunst, and GTK (see `AGENTS.md`) instead of Noto Sans Mono and Noto Sans,
       which fontconfig picks otherwise -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <!-- Give Firefox Arial for sans serif instead, since most sites are designed
       around it. Adwaita Sans's taller line height (1.21 vs Arial's 1.15) makes
       pages look off. Match only patterns that start with sans-serif, since
       fontconfig appends it to others (e.g. Firefox's "Adwaita Sans" UI font).
       Put this before the alias below, which inserts Adwaita Sans first -->
  <match target="pattern">
    <test name="prgname"><string>firefox</string></test>
    <test name="family" qual="first"><string>sans-serif</string></test>
    <edit mode="prepend" name="family"><string>Arial</string></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>

  <!-- Default to Windows' serif font, which most sites are designed around.
       Noto Serif's taller line height (1.36 vs Times New Roman's 1.15) makes
       pages look off -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>
</fontconfig>
