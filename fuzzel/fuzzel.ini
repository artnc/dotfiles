[main]
# Size fonts by the output's scaling factor like dunst and Sway, instead of by
# its DPI, which can make the same point size look larger here than elsewhere
dpi-aware=no
font=Adwaita Sans:size=12
# Space rows 1.5x the font size (24px) instead of Adwaita Sans's 1.21x (20px),
# which leaves descenders touching the selection's bottom edge
line-height=18
# Run terminal apps (e.g. htop) in Ghostty, since `TERMINAL` isn't set
terminal=ghostty -e
width=60

# Use Modus Vivendi colors to match Ghostty. Highlight the selection like
# Waybar's focused workspace, but keep its matched text white, since even the
# yellow match color has only 5.5:1 contrast on blue
# https://github.com/protesilaos/modus-themes/blob/main/modus-themes.el
[colors]
background=000000ff
border=646464ff
counter=989898ff
input=ffffffff
match=fec43fff
prompt=2fafffff
selection=1640b0ff
selection-match=ffffffff
selection-text=ffffffff
text=ffffffff

# Draw a gray border that sets the menu apart from the windows behind it, with
# square corners like Sway's and Waybar's
[border]
radius=0
width=2
