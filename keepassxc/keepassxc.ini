# `install.sh` merges these keys into the real file instead of symlinking it
# since KeePassXC writes a KeeShare private key there

[General]
AutoGeneratePasswordForNewEntries=true

[Browser]
BestMatchOnly=true
Enabled=true
MatchUrlScheme=false

[GUI]
ColorPasswords=true
MinimizeOnStartup=false
TrayIconAppearance=monochrome-light

[KeeShare]
QuietSuccess=true

[PasswordGenerator]
Length=40

[Security]
ClearClipboard=true
ClearClipboardTimeout=60
HidePasswordPreviewPanel=true
IconDownloadFallback=true
LockDatabaseIdle=true
LockDatabaseIdleSeconds=3600
LockDatabaseScreenLock=true
PasswordsHidden=false
Security_HideNotes=true

# Load SSH keys from entries into the agent at `SSH_AUTH_SOCK` on unlock. See
# `zsh/.zshenv`
[SSHAgent]
Enabled=true
