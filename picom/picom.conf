# Only composite for transparency and tear-free vsync. Shadows are off because
# picom draws them around the full rectangle of transparent overlay windows,
# e.g. the Vocalinux dictation bar, which leaves stray shadow edges on screen
backend = "glx";
fading = false;
shadow = false;
vsync = true;

# Slide notifications in from the right edge so that I notice them. Dunst maps
# and unmaps its window, which picom treats as open and close
rules = ({
  # Disable fading for all windows. With picom v13, adding the Dunst rule below
  # made windows fade on i3 workspace switches despite `fading = false`
  fade = false;
}, {
  animations = ({
    direction = "right";
    duration = 0.25;
    preset = "slide-in";
    triggers = ["open", "show"];
  }, {
    direction = "right";
    duration = 0.2;
    preset = "slide-out";
    triggers = ["close", "hide"];
  });
  match = "class_g = 'Dunst'";
});
